name: Frontend and Backend CI

on:
  push:
    branches: [ sarah-task1 ]
  pull_request:
    branches: [ sarah-task1 ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: |
          cd React-ToDoList/dive-react-app
          npm install

      - name: Build frontend
        run: |
          cd React-ToDoList/dive-react-app
          npm run build

  build-backend:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Test backend start
        run: |
          cd backend
          node index.js &
          sleep 3
